<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // SPA fallback: redirect 404s to index.html with the original path preserved
    const path = window.location.pathname;
    const baseURL = '/me/';
    
    // Only redirect if we're in the /me/ path and not already at index.html
    if (path.startsWith(baseURL) && !path.endsWith('index.html')) {
      // Store the original path and redirect to index.html
      sessionStorage.setItem('redirect_path', path);
      window.location.replace(baseURL + 'index.html');
    } else {
      // Not in /me/ path, show actual 404
      document.body.innerHTML = '<h1>404 - Page Not Found</h1>';
    }
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
</body>
</html>
