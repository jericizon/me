      - generic [ref=e302]:
        - region [ref=e303]:
          - heading "Toll calculator for Philippine expressways" [level=2] [ref=e304]
          - paragraph [ref=e305]: ExpresswayPH is a free Philippines toll calculator that helps you estimate toll fees and get a sense of travel time across major expressways in the Philippines. Choose your vehicle class, entry, and exit points to quickly see a breakdown of toll costs per expressway and RFID provider.
          - paragraph [ref=e306]: The tool currently supports popular expressways including SLEX, Skyway, NLEX-SCTEX, TPLEX, CALAX, MCX, CAVITEX, and STAR Tollway. Coverage may expand over time based on data availability and user feedback.
        - region "Additional information" [ref=e307]:
          - article [ref=e308]:
            - heading "Supported toll roads" [level=3] [ref=e309]
            - paragraph [ref=e310]: ExpresswayPH focuses on major Philippine expressways that use RFID systems like Autosweep and Easytrip. Toll fees are grouped by expressway so you can clearly see how much you pay on each segment of your route across different expressways in the Philippines.
            - list [ref=e311]:
              - listitem [ref=e312]: SLEX & Skyway network
              - listitem [ref=e313]: NLEX-SCTEX & TPLEX
              - listitem [ref=e314]: CALAX, MCX, CAVITEX & STAR Tollway
          - article [ref=e315]:
            - heading "Important disclaimer" [level=3] [ref=e316]
            - paragraph [ref=e317]: ExpresswayPH is an independent tool and is not affiliated with, endorsed by, or officially connected to any expressway operator or government agency. Toll fees shown here are estimates based on the latest publicly available information and may differ from the actual amount you pay at the toll plaza.
            - paragraph [ref=e318]: Always refer to official advisories and on-site signage for final toll rates and traffic conditions before you travel.
        - region [ref=e319]:
          - generic [ref=e320]:
            - heading "Your Guide to Philippine Expressways" [level=2] [ref=e321]
            - paragraph [ref=e322]: Everything you need to know before hitting the road.
          - generic [ref=e323]:
            - article [ref=e324]:
              - generic [ref=e325]: 💳
              - heading "RFID Systems" [level=3] [ref=e326]
              - paragraph [ref=e327]:
                - text: Philippine expressways use two main RFID systems.
                - strong [ref=e328]: Autosweep
                - text: works on SLEX, Skyway, NAIAx, STAR, MCX, and TPLEX.
                - strong [ref=e329]: Easytrip
                - text: is used for NLEX-SCTEX, CAVITEX, CALAX, and C5 South Link.
            - article [ref=e330]:
              - generic [ref=e331]: 🚗
              - heading "Vehicle Classes" [level=3] [ref=e332]
              - paragraph [ref=e333]:
                - strong [ref=e334]: "Class 1:"
                - text: Cars, jeepneys, vans, and motorcycles (400cc+).
                - strong [ref=e335]: "Class 2:"
                - text: Buses and light trucks.
                - strong [ref=e336]: "Class 3:"
                - text: Large trucks (3+ axles). Rates vary significantly by class, so ensure you select the correct one.
            - article [ref=e337]:
              - generic [ref=e338]: 🛣️
              - heading "Travel Tips" [level=3] [ref=e339]
              - paragraph [ref=e340]: Always maintain sufficient load in your RFID account to avoid penalties. Check your tire pressure and fuel/battery level before entering long expressways like TPLEX or NLEX-SCTEX where exits can be far apart.
        - region [ref=e341]:
          - heading "ExpresswayPH FAQs" [level=2] [ref=e342]
          - generic [ref=e343]:
            - article [ref=e344]:
              - heading "What is the ExpresswayPH toll calculator?" [level=3] [ref=e345]
              - paragraph [ref=e346]: ExpresswayPH is a free Philippines toll calculator and travel time estimator for major expressways. It helps drivers quickly understand approximate costs for their trips so they can plan budgets and routes more confidently.
            - article [ref=e347]:
              - heading "Is this an official toll calculator?" [level=3] [ref=e348]
              - paragraph [ref=e349]: No. ExpresswayPH is not an official calculator and is not connected to any toll operator. It is a community-built tool that provides estimates for convenience only.
            - article [ref=e350]:
              - heading "Which expressways are supported?" [level=3] [ref=e351]
              - paragraph [ref=e352]: The app currently covers SLEX, Skyway, NLEX-SCTEX, TPLEX, CALAX, MCX, CAVITEX, and STAR Tollway.
            - article [ref=e353]:
              - heading "Do you support RFID like Autosweep and Easytrip?" [level=3] [ref=e354]
              - paragraph [ref=e355]:
                - text: "No, the app does not support RFID as of now. For RFID balance checking, please use the main apps:"
                - link "MPT Hub" [ref=e356] [cursor=pointer]:
                  - /url: https://play.google.com/store/apps/details?id=com.outsystemsenterprise.mptc.DriveHubProd&hl=en
                - text: (Android) or
                - link "MPT Hub" [ref=e357] [cursor=pointer]:
                  - /url: https://apps.apple.com/ph/app/mpt-drivehub/id1600499395
                - text: (iOS), and
                - link "Autosweep" [ref=e358] [cursor=pointer]:
                  - /url: https://play.google.com/store/apps/details?id=com.balanceinquiry&hl=en
                - text: (Android) or
                - link "Autosweep" [ref=e359] [cursor=pointer]:
                  - /url: https://apps.apple.com/ph/app/autosweep-rfid-mobile-app/id6446928297
                - text: (iOS).
            - article [ref=e360]:
              - heading "Is the Philippines toll calculator free to use?" [level=3] [ref=e361]
              - paragraph [ref=e362]: Yes. The ExpresswayPH Philippines toll calculator is completely free to use and does not require you to create an account.
